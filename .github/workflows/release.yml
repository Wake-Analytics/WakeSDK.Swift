name: Release

# Separate from ci.yml on purpose: a `paths` filter and a tag trigger interact
# badly (a tag push has no reliable path diff), so the tag checks live here.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  version:
    name: sdkVersion matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: bash Scripts/verify-version.sh "$GITHUB_REF_NAME"

  test:
    name: Build and test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  ios:
    name: Build (iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS
        run: |
          xcodebuild build \
            -scheme Wake \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            -quiet
